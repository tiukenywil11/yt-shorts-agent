<svg xmlns="http://www.w3.org/2000/svg" width="2160" height="2224" viewBox="0 0 2160 2224">
<defs>
<filter id="wobble" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
<feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="11" result="wn"/>
<feDisplacementMap in="SourceGraphic" in2="wn" scale="8" xChannelSelector="R" yChannelSelector="G"/>
</filter>
<filter id="paper" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
<feTurbulence type="fractalNoise" baseFrequency="0.12 0.5" numOctaves="3" seed="29" result="pn"/>
<feColorMatrix in="pn" type="matrix" values="0 0 0 0 0.2275 0 0 0 0 0.1412 0 0 0 0 0.098 0.16 0 0 0 0" result="pf"/>
<feComposite in="pf" in2="SourceAlpha" operator="in" result="pc"/>
<feBlend in="pc" in2="SourceGraphic" mode="multiply"/>
</filter>
<filter id="shadow" filterUnits="userSpaceOnUse" x="0" y="0" width="2160" height="2224" color-interpolation-filters="sRGB"><feGaussianBlur in="SourceAlpha" stdDeviation="6" result="b"/><feOffset in="b" dx="11" dy="11" result="o"/><feFlood flood-color="#3A2419" flood-opacity="0.28"/><feComposite in2="o" operator="in" result="s"/><feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="piece" filterUnits="userSpaceOnUse" x="0" y="0" width="2160" height="2224" color-interpolation-filters="sRGB"><feGaussianBlur in="SourceAlpha" stdDeviation="3" result="b"/><feOffset in="b" dx="4" dy="4" result="o"/><feFlood flood-color="#3A2419" flood-opacity="0.28"/><feComposite in2="o" operator="in" result="s"/><feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<g filter="url(#shadow)"><g filter="url(#paper)"><g filter="url(#wobble)"><g transform="translate(10,0)">
<path d="M 0 0 L 2127 0 L 2127 1991 Q 2127 2201 1917 2201 L 210 2201 Q 0 2201 0 1991 Z" fill="#3A2419"/><path d="M 70 60 L 2097 60 L 2097 1971 Q 2097 2171 1897 2171 L 250 2171 Q 70 2171 70 1991 Z" fill="#7A4B2F"/><g fill="#3A2419"><ellipse cx="1620" cy="2090" rx="60" ry="34"/><ellipse cx="1780" cy="2110" rx="40" ry="24"/><ellipse cx="420" cy="2100" rx="48" ry="28"/></g>
</g></g></g></g>
