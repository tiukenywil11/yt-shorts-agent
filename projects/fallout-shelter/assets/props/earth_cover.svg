<svg xmlns="http://www.w3.org/2000/svg" width="1988" height="600" viewBox="0 0 1988 600">
<defs>
<filter id="wobble" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
<feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="11" result="wn"/>
<feDisplacementMap in="SourceGraphic" in2="wn" scale="8" xChannelSelector="R" yChannelSelector="G"/>
</filter>
<filter id="paper" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
<feTurbulence type="fractalNoise" baseFrequency="0.12 0.5" numOctaves="3" seed="29" result="pn"/>
<feColorMatrix in="pn" type="matrix" values="0 0 0 0 0.2275 0 0 0 0 0.1412 0 0 0 0 0.098 0.16 0 0 0 0" result="pf"/>
<feComposite in="pf" in2="SourceAlpha" operator="in" result="pc"/>
<feBlend in="pc" in2="SourceGraphic" mode="multiply"/>
</filter>
<filter id="shadow" filterUnits="userSpaceOnUse" x="0" y="0" width="1988" height="600" color-interpolation-filters="sRGB"><feGaussianBlur in="SourceAlpha" stdDeviation="6" result="b"/><feOffset in="b" dx="23" dy="23" result="o"/><feFlood flood-color="#3A2419" flood-opacity="0.28"/><feComposite in2="o" operator="in" result="s"/><feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="piece" filterUnits="userSpaceOnUse" x="0" y="0" width="1988" height="600" color-interpolation-filters="sRGB"><feGaussianBlur in="SourceAlpha" stdDeviation="3" result="b"/><feOffset in="b" dx="8" dy="8" result="o"/><feFlood flood-color="#3A2419" flood-opacity="0.28"/><feComposite in2="o" operator="in" result="s"/><feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<g filter="url(#shadow)"><g filter="url(#paper)"><g filter="url(#wobble)"><g transform="translate(10,10)">
<rect x="0" y="380" width="1943" height="175" rx="40" fill="#7A4B2F"/><g filter="url(#piece)"><path d="M 30 440 C 90 300 330 190 620 160 C 840 136 1110 136 1330 160 C 1620 192 1860 300 1915 440 Q 1920 470 1880 470 L 70 470 Q 24 470 30 440 Z" fill="#7A4B2F"/></g><ellipse cx="220" cy="470" rx="18" ry="12" fill="#F4E6C8"/><ellipse cx="520" cy="300" rx="14" ry="10" fill="#F4E6C8"/><ellipse cx="880" cy="420" rx="20" ry="13" fill="#F4E6C8"/><ellipse cx="1180" cy="260" rx="15" ry="10" fill="#F4E6C8"/><ellipse cx="1460" cy="440" rx="19" ry="12" fill="#F4E6C8"/><ellipse cx="1720" cy="480" rx="14" ry="9" fill="#F4E6C8"/>
</g></g></g></g>
</svg>
