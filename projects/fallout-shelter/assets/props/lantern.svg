<svg xmlns="http://www.w3.org/2000/svg" width="196" height="296" viewBox="0 0 196 296">
<defs>
<filter id="wobble" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
<feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="11" result="wn"/>
<feDisplacementMap in="SourceGraphic" in2="wn" scale="8" xChannelSelector="R" yChannelSelector="G"/>
</filter>
<filter id="paper" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
<feTurbulence type="fractalNoise" baseFrequency="0.12 0.5" numOctaves="3" seed="29" result="pn"/>
<feColorMatrix in="pn" type="matrix" values="0 0 0 0 0.2275 0 0 0 0 0.1412 0 0 0 0 0.098 0.16 0 0 0 0" result="pf"/>
<feComposite in="pf" in2="SourceAlpha" operator="in" result="pc"/>
<feBlend in="pc" in2="SourceGraphic" mode="multiply"/>
</filter>
<filter id="shadow" filterUnits="userSpaceOnUse" x="0" y="0" width="196" height="296" color-interpolation-filters="sRGB"><feGaussianBlur in="SourceAlpha" stdDeviation="6" result="b"/><feOffset in="b" dx="34" dy="34" result="o"/><feFlood flood-color="#3A2419" flood-opacity="0.28"/><feComposite in2="o" operator="in" result="s"/><feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="piece" filterUnits="userSpaceOnUse" x="0" y="0" width="196" height="296" color-interpolation-filters="sRGB"><feGaussianBlur in="SourceAlpha" stdDeviation="3" result="b"/><feOffset in="b" dx="11" dy="11" result="o"/><feFlood flood-color="#3A2419" flood-opacity="0.28"/><feComposite in2="o" operator="in" result="s"/><feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<g filter="url(#shadow)"><g filter="url(#paper)"><g filter="url(#wobble)"><g transform="translate(10,10)">
<path d="M 38 44 Q 70 -10 102 44" fill="none" stroke="#B86B43" stroke-width="12" stroke-linecap="round"/><rect x="30" y="60" width="80" height="130" rx="28" fill="#E9A93B"/><g fill="#B86B43"><rect x="22" y="58" width="14" height="134" rx="7"/><rect x="63" y="58" width="14" height="134" rx="7"/><rect x="104" y="58" width="14" height="134" rx="7"/></g><path d="M 18 64 L 34 32 L 106 32 L 122 64 Z" fill="#B86B43" stroke="#B86B43" stroke-width="10" stroke-linejoin="round"/><rect x="8" y="186" width="124" height="44" rx="16" fill="#B86B43"/>
</g></g></g></g>
</svg>
