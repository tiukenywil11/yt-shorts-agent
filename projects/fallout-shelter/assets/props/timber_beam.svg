<svg xmlns="http://www.w3.org/2000/svg" width="2248" height="224" viewBox="0 0 2248 224">
<defs>
<filter id="wobble" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
<feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="11" result="wn"/>
<feDisplacementMap in="SourceGraphic" in2="wn" scale="8" xChannelSelector="R" yChannelSelector="G"/>
</filter>
<filter id="paper" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
<feTurbulence type="fractalNoise" baseFrequency="0.12 0.5" numOctaves="3" seed="29" result="pn"/>
<feColorMatrix in="pn" type="matrix" values="0 0 0 0 0.2275 0 0 0 0 0.1412 0 0 0 0 0.098 0.16 0 0 0 0" result="pf"/>
<feComposite in="pf" in2="SourceAlpha" operator="in" result="pc"/>
<feBlend in="pc" in2="SourceGraphic" mode="multiply"/>
</filter>
<filter id="shadow" filterUnits="userSpaceOnUse" x="0" y="0" width="2248" height="224" color-interpolation-filters="sRGB"><feGaussianBlur in="SourceAlpha" stdDeviation="6" result="b"/><feOffset in="b" dx="23" dy="23" result="o"/><feFlood flood-color="#3A2419" flood-opacity="0.28"/><feComposite in2="o" operator="in" result="s"/><feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="piece" filterUnits="userSpaceOnUse" x="0" y="0" width="2248" height="224" color-interpolation-filters="sRGB"><feGaussianBlur in="SourceAlpha" stdDeviation="3" result="b"/><feOffset in="b" dx="8" dy="8" result="o"/><feFlood flood-color="#3A2419" flood-opacity="0.28"/><feComposite in2="o" operator="in" result="s"/><feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<g filter="url(#shadow)"><g filter="url(#paper)"><g filter="url(#wobble)"><g transform="translate(10,10)">
<rect x="0" y="0" width="2203" height="179" rx="34" fill="#7A4B2F"/><path d="M 140 52 C 500 40 800 64 1240 50 M 1560 56 C 1800 48 1960 58 2080 52 M 240 96 C 600 104 900 86 1300 100 M 1500 92 C 1720 100 1900 88 2000 96 M 120 134 C 560 126 1100 142 1900 130" fill="none" stroke="#F4E6C8" stroke-width="10" stroke-linecap="round"/><ellipse cx="1400" cy="80" rx="62" ry="26" fill="none" stroke="#F4E6C8" stroke-width="10"/><g fill="#3A2419"><circle cx="62" cy="90" r="13"/><circle cx="2141" cy="90" r="13"/></g>
</g></g></g></g>
</svg>
